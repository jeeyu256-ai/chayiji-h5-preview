<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>首页 · 茶已己</title><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F6F7FB;--ink:#111214;--sub:#9A9DA5;--line:#F0F1F4;--green:#2F7D57;--red:#E23B2E;--orange:#FF7A3D}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#E9ECEF;color:var(--ink)}
a{color:inherit;text-decoration:none;display:block}
button,input,textarea{font-family:inherit;border:0;outline:0;background:transparent;cursor:pointer}
.app{max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 24px;font-size:14px;font-weight:650;background:#fff}
.statusbar .sr{display:flex;align-items:center;gap:5px}
.statusbar svg{display:block}
.capsule{width:76px;height:30px;flex:none;border:1px solid #E9EAED;border-radius:16px;display:flex;align-items:center;justify-content:space-around;background:#fff}
.capsule .dots{display:flex;gap:3px}
.capsule .dots i{width:4px;height:4px;border-radius:50%;background:#1b1c1e;display:block}
.capsule .ring{width:14px;height:14px;border:1.6px solid #1b1c1e;border-radius:50%;position:relative}
.capsule .ring:after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:#1b1c1e}
.capsule .sep{width:1px;height:16px;background:#E9EAED}
.searchbar{height:34px;border-radius:17px;background:var(--bg);display:flex;align-items:center;gap:7px;padding:0 12px}
.searchbar input{font-size:12px;color:var(--ink);width:100%}
.searchbar input::placeholder{color:#B9BCC3}
.tabbar{height:68px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:6px;z-index:4}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#A4A7AE;cursor:pointer}
.tab svg{stroke:#A4A7AE}
.tab.on{color:var(--ink);font-weight:650}
.tab.on svg{stroke:var(--ink)}
.home-bar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:2px;background:#15171A;z-index:8}
.cartbar{position:absolute;left:12px;right:12px;bottom:76px;height:54px;border-radius:27px;background:#fff;box-shadow:0 6px 24px rgba(20,25,30,.14);display:flex;align-items:center;padding:0 7px 0 10px;z-index:6}
.cart-ico{width:42px;height:42px;flex:none;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#E23B2E;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.cart-info{flex:1;min-width:0;padding-left:9px;line-height:1.25}
.cart-info .lbl{font-size:10px;color:#8C9098}
.cart-info .total{color:var(--red);font-size:17px;font-weight:750}
.cart-info .total .cur{font-size:12px}
.cart-info .strike{font-size:10px;color:#BFC2C8;text-decoration:line-through;margin-left:4px;font-weight:400}
.cart-info .save{font-size:9px;color:var(--orange);margin-left:5px}
.pay{height:40px;flex:none;padding:0 20px;border-radius:20px;background:#15171A;color:#fff;font-size:13px;font-weight:650;display:flex;align-items:center}
.pay:active{background:#333}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);background:rgba(20,22,25,.88);color:#fff;font-size:12px;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:20;white-space:nowrap;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.tag{font-size:9px;color:#E4573A;background:#FFF0EA;border-radius:3px;padding:2px 4px;line-height:1;display:inline-block}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:22px;height:22px;border-radius:50%;border:1px solid #DDE0E4;font-size:14px;color:#333;display:flex;align-items:center;justify-content:center;background:#fff}
.qty .plus{background:#15171A;color:#fff;border-color:#15171A}
.qty-num{font-size:12px;min-width:12px;text-align:center}
/* 通用页头 */
.p-head{height:44px;flex:none;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;font-weight:650}
.p-head .back{width:26px;height:26px;flex:none;border-radius:50%;background:#F1F2F5;display:flex;align-items:center;justify-content:center;font-size:19px;color:#333;line-height:1}
.p-head .tt{flex:1;text-align:center;margin-right:76px}
.p-head .tt.full{margin-right:0}
.p-head .h-right{flex:none;font-size:11px;color:#8C9098;font-weight:400}
/* 通用容器 */
.p-main{flex:1;min-height:0;overflow-y:auto;background:var(--bg);padding:12px;scrollbar-width:none}
.p-main::-webkit-scrollbar{display:none}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
.card-title{font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title span{font-size:10px;color:var(--sub);font-weight:400}
.muted{color:var(--sub)}
.sec{font-size:11px;color:#8C9098;padding:4px 2px 8px}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;font-size:12.5px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .chev{margin-left:auto;color:#B9BCC3;font-size:15px}
.row .val{margin-left:auto;color:#8C9098;font-size:11.5px}
.row .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--green)}
.list{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px}
/* 按钮 */
.btn{height:44px;width:100%;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650}
.btn-dark{background:#15171A;color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;border:1px solid #D8DBDF;color:#333}
.btn:active{opacity:.85}
.foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 14px 20px;display:flex;align-items:center;gap:12px}
.foot .sum{flex:1;font-size:10px;color:#8C9098;line-height:1.4}
.foot .sum b{display:block;color:var(--red);font-size:19px;font-weight:750}
.foot .sum b i{font-size:12px;font-style:normal}
.foot .btn{min-width:116px;width:auto;padding:0 16px;height:42px;flex:none}
/* 分段切换 */
.segs{display:flex;background:#fff;flex:none;border-bottom:1px solid var(--line)}
.segs a{flex:1;text-align:center;padding:12px 0;font-size:12px;color:#8C9098;position:relative;cursor:pointer}
.segs a.on{color:var(--ink);font-weight:700}
.segs a.on:after{content:"";position:absolute;bottom:0;left:32%;right:32%;height:2px;background:var(--green);border-radius:2px}
/* 空态 */
.empty{padding:70px 20px;text-align:center;color:var(--sub);font-size:12px;line-height:1.8}
.empty .e-ico{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:#EEF1EE;display:flex;align-items:center;justify-content:center;font-size:28px;color:#9FB3A5}
.empty .btn{margin:18px auto 0;max-width:150px;background:#15171A;color:#fff;height:38px;font-size:12px}
/* 商品条 */
.gcard{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.gcard:last-child{border-bottom:0}
.gcard img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:#F3F4F6}
.gcard .gi{flex:1;min-width:0}
.gcard .gi b{font-size:12.5px;display:block}
.gcard .gi .g-spec{font-size:10px;color:var(--sub);margin:4px 0}
.gcard .gi .g-pr{color:var(--red);font-size:13px;font-weight:700}
.gcard .gi .g-pr s{color:#BFC2C8;font-size:10px;font-weight:400;margin-left:4px}
/* 优惠券 */
.cpn{background:#fff;border-radius:12px;display:flex;align-items:center;margin-bottom:10px;overflow:hidden;border:1px solid #F0F1F4}
.cpn .cl{width:94px;flex:none;background:linear-gradient(135deg,#2F7D57,#4CA578);color:#fff;padding:18px 6px;text-align:center}
.cpn .cl b{font-size:26px;font-weight:750}
.cpn .cl b i{font-size:13px;font-style:normal}
.cpn .cl span{display:block;font-size:9px;opacity:.85;margin-top:3px}
.cpn .cr{flex:1;padding:12px;min-width:0}
.cpn .cr b{font-size:12.5px;display:block}
.cpn .cr span{font-size:10px;color:var(--sub);display:block;margin:5px 0}
.cpn .cr a{display:inline-block;font-size:10px;color:#fff;background:#15171A;border-radius:12px;padding:5px 12px}
.cpn.gray .cl{background:#C7CBD0}
.cpn.gray .cr a{background:#E4E6EA;color:#9A9DA5}
/* 徽标 */
.pill{font-size:9.5px;padding:3px 7px;border-radius:10px;display:inline-block}
.pill.green{background:#E8F4EC;color:var(--green)}
.pill.orange{background:#FFF0E7;color:var(--orange)}
.pill.gray{background:#F1F2F5;color:#9A9DA5}
.pill.red{background:#FFECEA;color:var(--red)}
/* 表单 */
.field{display:flex;align-items:center;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.field:last-child{border-bottom:0}
.field label{width:78px;flex:none;color:#555}
.field input,.field textarea{flex:1;font-size:12px;color:var(--ink);resize:none}
.field input::placeholder,.field textarea::placeholder{color:#B9BCC3}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #CFD3D8;flex:none;display:flex;align-items:center;justify-content:center;margin-left:auto}
.radio.on{border-color:var(--green)}
.radio.on:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
/* 金额 */
.mrow{display:flex;justify-content:space-between;font-size:11.5px;color:#7C808A;padding:5px 0}
.mrow b{color:var(--ink);font-size:12px}
.mrow .red{color:var(--red)}
.hr{border-top:1px dashed var(--line);margin:10px 0;padding-top:10px}
/* 宫格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#fff;border-radius:10px;padding:12px 6px;text-align:center}
.tile .t-ico{font-size:21px}
.tile b{display:block;font-size:11.5px;margin:6px 0 3px}
.tile span{font-size:9.5px;color:var(--sub)}
/* 我的页头部 */
.mine-top{background:linear-gradient(160deg,#2F7D57,#57A97B);padding:12px 16px 24px;color:#fff}
.mine-top .mu{display:flex;align-items:center;gap:11px}
.mine-top .ava{width:52px;height:52px;border-radius:50%;background:#EAF3EC;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.mine-top b{font-size:15px;display:block}
.mine-top span{font-size:10.5px;opacity:.85}
.mine-top .pill{background:rgba(255,255,255,.2);color:#fff;margin-top:5px}
.asset{display:flex;background:#fff;border-radius:12px;margin:-14px 14px 12px;padding:14px 0;position:relative;z-index:2;box-shadow:0 4px 18px rgba(20,40,25,.07)}
.asset a{flex:1;text-align:center;border-right:1px solid var(--line)}
.asset a:last-child{border-right:0}
.asset b{font-size:16px;display:block}
.asset span{font-size:10px;color:var(--sub)}

/* 首页按 Figma 375x962 画板 1:1 还原；桌面等比缩放保证整页完整可见，手机端保持全屏+滚动 */
body[data-page="home"]{overflow:hidden;background:#E9ECEF}
body[data-page="home"] .app{position:absolute;top:0;left:50%;margin:0 0 0 -187.5px;width:375px;max-width:none;height:962px;background:#F0F3FA;zoom:var(--hz,1)}
@media (max-width:430px){body[data-page="home"]{overflow:auto}body[data-page="home"] .app{position:relative;left:auto;margin:0 auto;width:100%;max-width:375px;height:100dvh;zoom:1}}
body[data-page="home"] .home-bar{bottom:10px;width:104px}
.hero{display:block;width:100%;height:auto;flex:none}
.home-main{flex:1;min-height:0;overflow-y:auto;background:#F0F3FA;padding:0 13px 14px;position:relative;z-index:2;scrollbar-width:none}
.home-main::-webkit-scrollbar{display:none}
.user-card{background:#fff;border-radius:14px;height:81px;padding:0 14px;display:flex;align-items:center;gap:11px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:#EDF0F4;display:block}
.u-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.u-info b{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-info span{font-size:11.5px;color:#A0A3AB}
.coupon{background:#111214;color:#fff;font-size:11.5px;padding:8px 14px;border-radius:16px;flex:none;font-weight:500;white-space:nowrap}
.entries{margin-top:10px;background:#fff;border-radius:14px;height:175px;display:grid;grid-template-columns:1fr 1fr;position:relative}
.entries:before{content:"";position:absolute;left:50%;top:22px;bottom:22px;width:1px;background:#EDEFF3}
.entry{display:flex;flex-direction:column;align-items:center;justify-content:center}
.entry svg{width:60px;height:65px;display:block;margin-bottom:11px}
.entry b{font-size:17px;font-weight:700;letter-spacing:.3px}
.entry span{font-size:12px;color:#A6A9B1;margin-top:6px}
.promo{margin-top:12px;display:block;width:100%;border-radius:12px;overflow:hidden}
.promo img{display:block;width:100%;height:auto}
.h-tabbar{height:82px;flex:none;background:#fff;display:flex;padding-top:8px;z-index:4}
.h-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#A4A7AE}
.h-tab svg{width:25px;height:25px;display:block}
.h-tab.on{color:#15171A;font-weight:700}

 clear:function(){s.cart=[];save()},
 coupons:function(){return s.coupons},
 coupon:function(id){return s.coupons.filter(function(c){return c.id===id})[0]||null},
 usableCoupons:function(){return s.coupons.filter(function(c){return c.status==='usable'})},
 bestCoupon:function(){
   var base=this.total();
   if(s.selCoupon==='none')return null;
   var ok=this.usableCoupons().filter(function(c){return base>=c.limit});
   ok.sort(function(a,b){return b.amount-a.amount});
   var sel=this.coupon(s.selCoupon);
   if(sel&&sel.status==='usable'&&base>=sel.limit)return sel;
   return ok[0]||null;
 },
 setCoupon:function(id){s.selCoupon=id;save()},
 orders:function(){return s.orders},
 order:function(id){return s.orders.filter(function(o){return o.id===id})[0]||s.orders[0]||null},
 lastOrder:function(){return this.order(s.lastOrderId)},
 createOrder:function(opt){
   var cp=opt.couponId?this.coupon(opt.couponId):null;
   var goods=this.goods(),promo=this.promo(),base=this.total();
   var discount=(cp&&base>=cp.limit)?cp.amount:0;
   var o={
    id:'o'+Date.now(),no:String(Date.now()).slice(-12),pick:String(1000+Math.floor(Math.random()*8999)),
    status:'unpaid',storeId:s.storeId,pay:'',note:opt.note||'',pickup:opt.pickup||'立即取餐',time:now(),
    items:s.cart.map(function(c){return {name:c.name,spec:c.spec,img:c.img,price:c.price,origin:c.origin,qty:c.qty}}),
    goods:goods,promo:promo,coupon:discount,total:Math.max(0,base-discount),couponTitle:cp?cp.title:''
   };
   s.orders.unshift(o);s.lastOrderId=o.id;s.cart=[];save();return o;
 },
 payOrder:function(id,method){
   var o=this.order(id);if(!o)return null;
   o.status='making';o.pay=method;save();return o;
 },
 reorder:function(id){
   var o=this.order(id);if(!o)return;
   var self=this;
   o.items.forEach(function(it){self.add({id:it.name,spec:it.spec,qty:it.qty,name:it.name,img:it.img,price:it.price,origin:it.origin})});
 },
 user:function(){return s.user},
 login:function(name){s.user.logged=true;if(name)s.user.name=name;save()},
 logout:function(){s.user.logged=false;save()},
 history:function(){return s.searchHistory},
 addHistory:function(k){if(!k)return;s.searchHistory=[k].concat(s.searchHistory.filter(function(x){return x!==k})).slice(0,6);save()}
};

window.qs=function(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):''};
window.money=function(n){return (Math.round(n*100)/100).toFixed(2)};
window.TOAST=function(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.classList.remove('show')},1400)};
window.renderCartBar=function(){
 var n=DB.count(),t=DB.total(),g=DB.goods();
 document.querySelectorAll('[data-cart-count]').forEach(function(e){e.textContent=n;e.style.display=n?'flex':'none'});
 document.querySelectorAll('[data-cart-total]').forEach(function(e){e.textContent=money(t)});
 document.querySelectorAll('[data-cart-origin]').forEach(function(e){e.textContent='¥'+g});
 document.querySelectorAll('[data-cart-save]').forEach(function(e){e.textContent='已优惠 ¥'+(g-t);e.style.display=(g-t)>0?'inline':'none'});
 document.querySelectorAll('[data-cart-empty]').forEach(function(e){e.style.display=n?'none':'block'});
 document.querySelectorAll('[data-cart-full]').forEach(function(e){e.style.display=n?'flex':'none'});
 var b=document.querySelector('.cartbar .pay');
 if(b&&!n){b.textContent='去选购';b.setAttribute('href','order.html')}
};
/* 全部采用事件委托，保证动态渲染出的按钮同样可交互 */
window.bindCommon=function(){
 document.addEventListener('click',function(e){
   var t=e.target;
   if(!t||!t.closest)return;
   var toast=t.closest('[data-toast]');
   if(toast){e.preventDefault();TOAST(toast.dataset.toast);return}
   var reset=t.closest('[data-reset]');
   if(reset){e.preventDefault();DB.reset();TOAST('演示数据已重置');setTimeout(function(){location.href='index.html'},800);return}
   var opt=t.closest('.opt-group[data-simple] .opt');
   if(opt){
     var g=opt.closest('.opt-group');
     g.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on')});
     opt.classList.add('on');document.dispatchEvent(new CustomEvent('optchange'));return;
   }
   var qb=t.closest('.qty[data-simple] .minus,.qty[data-simple] .plus');
   if(qb){
     var q=qb.closest('.qty'),n=q.querySelector('.qty-num');
     n.textContent=qb.classList.contains('minus')?Math.max(1,+n.textContent-1):+n.textContent+1;
     document.dispatchEvent(new CustomEvent('qtychange'));return;
   }
   var rd=t.closest('[data-radio-group] [data-radio]');
   if(rd){
     var rg=rd.closest('[data-radio-group]');
     rg.querySelectorAll('[data-radio]').forEach(function(x){var r=x.querySelector('.radio');if(r)r.classList.remove('on');x.dataset.on='0'});
     var mark=rd.querySelector('.radio');if(mark)mark.classList.add('on');rd.dataset.on='1';
     document.dispatchEvent(new CustomEvent('radiochange',{detail:{group:rg.dataset.radioGroup,value:rd.dataset.radio}}));return;
   }
 });
};
document.addEventListener('DOMContentLoaded',function(){
 bindCommon();renderCartBar();
 document.dispatchEvent(new CustomEvent('demo:ready'));
});
})();
</script>
<script>
function fitHome(){
  if(window.innerWidth<=430){document.querySelector('.app').style.removeProperty('--hz');return}
  var s=Math.min(1,window.innerHeight/962,window.innerWidth/375);
  document.querySelector('.app').style.setProperty('--hz',s.toFixed(4));
}
fitHome();window.addEventListener('resize',fitHome);
document.addEventListener('DOMContentLoaded',function(){
  var u=DB.user();
  document.getElementById('homeName').textContent=u.logged?u.name:'点击登录';
  document.getElementById('homePhone').textContent=u.phone;
  document.getElementById('homeCoupon').textContent=DB.usableCoupons().length+'张优惠券';
  document.getElementById('homeUser').onclick=function(){location.href=u.logged?'mine.html':'login.html'};
});
</script></body></html>
